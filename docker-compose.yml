# Wealth Flightpath AI — production compose file
# HTTPS is terminated by Nginx Proxy Manager. This container speaks plain HTTP
# on the host port defined by APP_PORT (default 3000).

services:
  web:
    image: ${IMAGE:-ghcr.io/CHANGE_ME/wealth-flightpath-ai:latest}
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
    container_name: wealth-flightpath
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      NODE_ENV: "production"
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      io.portainer.accesscontrol.teams: "admins"